# Push a tag like v0.4.0 -> GitHub builds the signed app and publishes it as a release.
# The phones check the latest release twice a day and update themselves (android/.../Updater.kt).
#
# Repo secrets (Settings -> Secrets and variables -> Actions):
#   GOOGLE_SERVICES_JSON  base64 of android/app/google-services.json
#   KEYSTORE_B64          base64 of android/doorbell-release.jks
#   KEYSTORE_PASSWORD     its password (the key uses the same one)
name: Release app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag must match the app version
        run: |
          V=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "app version $V, tag ${GITHUB_REF_NAME}"
          test "v$V" = "${GITHUB_REF_NAME}"
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Secret files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          echo "$KEYSTORE_B64" | base64 -d > release.jks

      - name: Build
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "doorbell-$VERSION.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "doorbell-$VERSION.apk" --title "Doorbell $VERSION" --generate-notes
