<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doorbell test panel</title>
<style>
:root {
  --bg: #f5f2ed; --card: #fffdf9; --ink: #2b2723; --muted: #8a8279; --line: #e8e2d9;
  --idle: #b9b1a6; --ring: #e8963a; --talk: #3a9a6a; --door: #3f7fd8; --danger: #c9533f;
  --shadow: 0 1px 2px rgba(60,40,20,.06), 0 8px 24px rgba(60,40,20,.06);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #171513; --card: #211e1b; --ink: #f1ece6; --muted: #9a9187; --line: #332f2a;
          --idle: #5d5750; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 460px; margin: 0 auto; padding: 28px 16px 48px; display: grid; gap: 14px; }
header { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
.meta { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }

.status { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 30px 20px 26px; }
.orb { width: 108px; height: 108px; border-radius: 50%; background: var(--c, var(--idle)); position: relative;
  display: grid; place-items: center; color: #fff; transition: background .3s; margin-bottom: 12px; }
.orb svg { width: 44px; height: 44px; }
.orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--c, var(--idle)); opacity: 0; }
.pulse .orb::after { animation: ring 1.4s ease-out infinite; }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.45); opacity: 0; } }
.title { font-size: 24px; font-weight: 650; letter-spacing: -.015em; }
.sub { color: var(--muted); min-height: 1.5em; }

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 14px 12px; cursor: pointer;
  transition: transform .08s, opacity .2s, background .2s; }
button:active { transform: scale(.97); }
button:disabled { opacity: .35; cursor: default; transform: none; }
.primary { background: var(--ring); color: #fff; }
.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { background: transparent; color: var(--muted); padding: 10px; border-radius: 11px; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.hint { color: var(--muted); font-size: 13px; margin: 10px 2px 0; }

.phones { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--talk); }
.empty { color: var(--muted); font-size: 14px; }

ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
li { display: flex; gap: 12px; font-size: 14px; }
li time { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 58px; }
.stats { display: flex; gap: 18px; color: var(--muted); font-size: 13px; padding: 0 4px; }
.offline .orb { --c: var(--danger) !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Doorbell</h1>
    <span class="meta" id="meta">test panel</span>
  </header>

  <section class="card status" id="status">
    <div class="orb" id="orb"></div>
    <div class="title" id="title">Connecting…</div>
    <div class="sub" id="sub">&nbsp;</div>
  </section>

  <section class="card">
    <p class="label">Visitor at the door</p>
    <div class="row">
      <button class="primary" id="ring">Ring the apartment</button>
      <button class="danger" id="release">Hang up</button>
    </div>
    <p class="hint">Ringing stops by itself after 45 s if nobody answers, and a conversation ends after 120 s.</p>
  </section>

  <section class="card">
    <p class="label">What the phone hears</p>
    <div class="seg">
      <button data-mode="echo">Echo of your voice</button>
      <button data-mode="tone">Beep</button>
    </div>
  </section>

  <section class="card">
    <p class="label">Phones that get the ring</p>
    <div class="phones" id="push"></div>
    <p class="hint" id="pushlast"></p>
  </section>

  <section class="card">
    <p class="label">Phones in the app right now</p>
    <div class="phones" id="phones"></div>
  </section>

  <section class="card">
    <p class="label">What happened</p>
    <ol id="log"></ol>
  </section>

  <div class="stats" id="stats"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const ICON = {
  bell: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-1.7 1.7A1 1 0 0 0 4 19.4h16a1 1 0 0 0 .7-1.7Z"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 15.4c-1.2 0-2.4-.2-3.5-.6a1 1 0 0 0-1 .3l-1.6 2a15 15 0 0 1-6.9-6.9l2-1.6a1 1 0 0 0 .2-1A11 11 0 0 1 8.6 4a1 1 0 0 0-1-1H4.2C3.6 3 3 3.2 3 4c0 9.3 7.7 17 17 17 .7 0 1-.6 1-1.2v-3.4a1 1 0 0 0-1-1Z"/></svg>',
  door: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h9a2 2 0 0 1 2 2v1h1a2 2 0 0 1 2 2v13h1v2H3v-2h1V4a2 2 0 0 1 2-2Zm9 18V4H6v16h9Zm2 0h1V7h-1v13Zm-5-9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>',
  off: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 21h22L12 2Zm1 15h-2v-2h2v2Zm0-4h-2V9h2v4Z"/></svg>',
};
let s = null;

function ago(sec) {
  if (sec < 60) return sec + ' s ago';
  if (sec < 3600) return Math.floor(sec / 60) + ' min ago';
  return Math.floor(sec / 3600) + ' h ago';
}

function render() {
  const st = $('status');
  if (!s) {
    st.className = 'card status offline';
    $('orb').innerHTML = ICON.off;
    $('title').textContent = 'Not responding';
    $('sub').textContent = 'Trying again…';
    return;
  }
  let c, icon, title, sub, pulse = false;
  if (s.door_open) {
    c = '--door'; icon = ICON.door; title = 'Door open'; sub = 'Opened by ' + (s.owner || 'a phone');
  } else if (s.state === 'ringing') {
    c = '--ring'; icon = ICON.bell; title = 'Ringing…'; sub = 'Waiting for a phone to answer'; pulse = true;
  } else if (s.state === 'talking') {
    c = '--talk'; icon = ICON.phone; title = 'Talking'; sub = 'Answered on ' + s.owner;
  } else {
    c = '--idle'; icon = ICON.moon; title = 'Quiet'; sub = 'Nobody at the door';
  }
  st.className = 'card status' + (pulse ? ' pulse' : '');
  $('orb').style.setProperty('--c', `var(${c})`);
  $('orb').innerHTML = icon;
  $('title').textContent = title;
  $('sub').textContent = sub;

  $('ring').disabled = s.state !== 'idle';
  $('release').disabled = s.state === 'idle';
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === s.emu_audio));

  $('phones').innerHTML = s.clients.length
    ? s.clients.map(n => `<span class="chip">${esc(n)}</span>`).join('')
    : '<span class="empty">No phone connected</span>';
  const p = s.push || { phones: [], last: 'push not configured', ready: false };
  $('push').innerHTML = p.phones.length
    ? p.phones.map(n => `<span class="chip">${esc(n)}</span>`).join('')
    : '<span class="empty">No phone registered yet. Open the app once on home Wi-Fi.</span>';
  $('pushlast').textContent = (p.ready ? 'Google push ready. ' : 'Google push not ready yet. ') + 'Last: ' + p.last;
  $('log').innerHTML = s.log.length
    ? s.log.map(l => `<li><time>${ago(s.uptime_s - l.t)}</time><span>${esc(l.msg)}</span></li>`).join('')
    : '<li class="empty">Nothing yet</li>';
  $('meta').textContent = `fw ${s.fw} · ${s.rssi ?? '?'} dBm`;
  $('stats').innerHTML = `<span>${s.calls} calls</span><span>${s.opens} doors opened</span><span>up ${ago(s.uptime_s).replace(' ago', '')}</span>`;
}

function esc(t) { return String(t).replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch])); }

async function poll() {
  try {
    const r = await fetch('/status', { cache: 'no-store' });
    s = await r.json();
  } catch { s = null; }
  render();
}

async function post(path) {
  await fetch(path, { method: 'POST' }).catch(() => {});
  poll();
}

$('ring').onclick = () => post('/api/ring');
$('release').onclick = () => post('/api/release');
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => post('/api/audio?mode=' + b.dataset.mode));

poll();
setInterval(poll, 500);
</script>
</body>
</html>
